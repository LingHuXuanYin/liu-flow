<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主屏 · 流 Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&family=Roboto+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', 'Noto Sans SC', sans-serif; background: #FEF7FF; }
        .mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="overflow-hidden">

    <div class="w-full h-screen bg-surface text-on-surface flex flex-col relative">

        <!-- 状态栏 24dp -->
        <div class="flex items-center justify-between px-6 pt-3 pb-1 text-xs">
            <span class="mono font-medium">9:41</span>
            <div class="flex items-center gap-1.5 text-on-surface">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-[12px]"></i>
            </div>
        </div>

        <!-- TopAppBar Medium 112dp -->
        <div class="px-6 pt-4 pb-3">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-xs text-on-surface-variant tracking-wider mb-1">TUESDAY · 8月23日</div>
                    <h1 class="text-[28px] font-normal leading-tight">准备专注</h1>
                </div>
                <button class="w-10 h-10 rounded-full state-layer flex items-center justify-center">
                    <i class="fa-regular fa-bell text-on-surface-variant text-lg"></i>
                </button>
            </div>
        </div>

        <!-- 主体 -->
        <div class="flex-1 flex flex-col items-center px-6 pt-2 pb-32">

            <!-- 圆环计时器 -->
            <div class="relative my-6">
                <svg width="280" height="280" viewBox="0 0 280 280" class="-rotate-90">
                    <!-- 背景圆环 -->
                    <circle cx="140" cy="140" r="128" fill="none" stroke="#E7E0EC" stroke-width="12" />
                    <!-- 进度圆环（演示 62% 进度） -->
                    <circle cx="140" cy="140" r="128" fill="none" stroke="#6750A4" stroke-width="12"
                        stroke-dasharray="804.25" stroke-dashoffset="305.6" stroke-linecap="round"
                        style="transition: stroke-dashoffset 0.3s ease;" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <div class="text-xs text-on-surface-variant tracking-widest mb-1">准备中</div>
                    <div class="mono text-[64px] font-light leading-none tracking-tight text-on-surface">25:00</div>
                    <div class="text-xs text-on-surface-variant mt-2">轻触「开始」进入专注</div>
                </div>
            </div>

            <!-- 任务输入 -->
            <div class="w-full mb-5">
                <div class="text-xs text-on-surface-variant tracking-wider mb-2 px-1">现在做什么？</div>
                <div class="bg-surface-container rounded-2xl px-5 py-4 state-layer">
                    <input type="text" placeholder="例如：写 PRD、整理收件箱"
                        class="w-full bg-transparent text-base outline-none placeholder:text-on-surface-variant/60" value="整理收件箱">
                </div>
            </div>

            <!-- 分类标签 -->
            <div class="w-full mb-4">
                <div class="text-xs text-on-surface-variant tracking-wider mb-2 px-1">分类</div>
                <div class="flex flex-wrap gap-2">
                    <button class="px-3.5 py-1.5 rounded-lg border border-primary text-primary text-sm font-medium flex items-center gap-1.5 state-layer">
                        <i class="fa-solid fa-check text-[10px]"></i>
                        <i class="fa-solid fa-pen-fancy text-xs"></i>
                        <span>写作</span>
                    </button>
                    <button class="px-3.5 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant text-sm state-layer flex items-center gap-1.5">
                        <i class="fa-solid fa-code text-xs"></i>
                        <span>编程</span>
                    </button>
                    <button class="px-3.5 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant text-sm state-layer flex items-center gap-1.5">
                        <i class="fa-solid fa-book-open text-xs"></i>
                        <span>阅读</span>
                    </button>
                    <button class="px-3.5 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant text-sm state-layer flex items-center gap-1.5">
                        <i class="fa-solid fa-graduation-cap text-xs"></i>
                        <span>学习</span>
                    </button>
                    <button class="px-3.5 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant text-sm state-layer flex items-center gap-1.5">
                        <i class="fa-solid fa-palette text-xs"></i>
                        <span>设计</span>
                    </button>
                    <button class="px-3.5 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant text-sm state-layer flex items-center gap-1.5">
                        <i class="fa-regular fa-circle text-xs"></i>
                        <span>其他</span>
                    </button>
                </div>
            </div>

            <!-- 时长选择 -->
            <div class="w-full">
                <div class="text-xs text-on-surface-variant tracking-wider mb-2 px-1">时长</div>
                <div class="flex gap-2">
                    <button class="flex-1 py-2.5 rounded-xl border border-outline-variant text-on-surface-variant text-sm state-layer">15</button>
                    <button class="flex-1 py-2.5 rounded-xl bg-primary-container text-on-primary-container text-sm font-medium state-layer">25</button>
                    <button class="flex-1 py-2.5 rounded-xl border border-outline-variant text-on-surface-variant text-sm state-layer">45</button>
                    <button class="flex-1 py-2.5 rounded-xl border border-outline-variant text-on-surface-variant text-sm state-layer">60</button>
                    <button class="flex-1 py-2.5 rounded-xl border border-outline-variant text-on-surface-variant text-sm state-layer">自定义</button>
                </div>
            </div>

        </div>

        <!-- Extended FAB（MD3 风格） -->
        <div class="absolute bottom-24 right-6">
            <button class="bg-primary text-on-primary rounded-2xl h-14 pl-5 pr-6 flex items-center gap-2 shadow-lg state-layer">
                <i class="fa-solid fa-play text-base"></i>
                <span class="text-sm font-medium">开始</span>
            </button>
        </div>

        <!-- NavigationBar 80dp -->
        <div class="absolute bottom-0 left-0 right-0 bg-surface-container border-t border-outline-variant/30">
            <div class="flex items-stretch h-20 px-3">
                <button class="flex-1 flex flex-col items-center justify-center gap-1 state-layer">
                    <div class="px-5 py-1 rounded-full bg-primary-container">
                        <i class="fa-solid fa-droplet text-primary text-lg"></i>
                    </div>
                    <span class="text-[11px] font-medium text-on-surface">专注</span>
                </button>
                <button class="flex-1 flex flex-col items-center justify-center gap-1 state-layer">
                    <i class="fa-regular fa-clock text-on-surface-variant text-lg"></i>
                    <span class="text-[11px] text-on-surface-variant">记录</span>
                </button>
                <button class="flex-1 flex flex-col items-center justify-center gap-1 state-layer">
                    <i class="fa-regular fa-user text-on-surface-variant text-lg"></i>
                    <span class="text-[11px] text-on-surface-variant">我的</span>
                </button>
            </div>
        </div>

    </div>

</body>
</html>
