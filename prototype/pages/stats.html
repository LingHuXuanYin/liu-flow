<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>统计详情 · 流 Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&family=Roboto+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', 'Noto Sans SC', sans-serif; background: #FEF7FF; }
        .mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="overflow-hidden">

    <div class="w-full h-screen bg-surface text-on-surface flex flex-col">

        <!-- 状态栏 -->
        <div class="flex items-center justify-between px-6 pt-3 pb-1 text-xs">
            <span class="mono font-medium">9:41</span>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-[12px]"></i>
            </div>
        </div>

        <!-- TopAppBar -->
        <div class="px-3 pt-2 pb-2 flex items-center justify-between">
            <button onclick="window.location.href='history.html'" class="w-10 h-10 rounded-full state-layer flex items-center justify-center">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <div class="text-sm font-medium">统计</div>
            <button class="w-10 h-10 rounded-full state-layer flex items-center justify-center text-on-surface-variant">
                <i class="fa-solid fa-arrow-up-from-bracket text-base"></i>
            </button>
        </div>

        <!-- 主体 -->
        <div class="flex-1 overflow-y-auto pb-24 px-5">

            <!-- 4 个概览卡 -->
            <div class="grid grid-cols-2 gap-3 mb-5 mt-2">
                <div class="bg-surface-container rounded-2xl p-4">
                    <div class="text-[10px] text-on-surface-variant tracking-wider mb-2">本周次数</div>
                    <div class="mono text-3xl font-light">14</div>
                    <div class="text-[10px] text-primary mt-1">↑ 18% vs 上周</div>
                </div>
                <div class="bg-surface-container rounded-2xl p-4">
                    <div class="text-[10px] text-on-surface-variant tracking-wider mb-2">本周时长</div>
                    <div class="mono text-3xl font-light">5<span class="text-base text-on-surface-variant">h</span>50<span class="text-base text-on-surface-variant">m</span></div>
                    <div class="text-[10px] text-primary mt-1">↑ 25% vs 上周</div>
                </div>
                <div class="bg-surface-container rounded-2xl p-4">
                    <div class="text-[10px] text-on-surface-variant tracking-wider mb-2">连续天数</div>
                    <div class="mono text-3xl font-light text-primary">12</div>
                    <div class="text-[10px] text-on-surface-variant mt-1">最佳 28 天</div>
                </div>
                <div class="bg-surface-container rounded-2xl p-4">
                    <div class="text-[10px] text-on-surface-variant tracking-wider mb-2">完成率</div>
                    <div class="mono text-3xl font-light">92<span class="text-base text-on-surface-variant">%</span></div>
                    <div class="text-[10px] text-on-surface-variant mt-1">放弃 2 次</div>
                </div>
            </div>

            <!-- 连续天数详情 -->
            <div class="bg-gradient-to-br from-primary to-[#4F378B] rounded-2xl p-5 mb-5 text-white relative overflow-hidden">
                <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full"></div>
                <div class="relative">
                    <div class="flex items-center gap-2 mb-2">
                        <i class="fa-solid fa-fire text-2xl text-orange-300"></i>
                        <span class="text-sm font-medium">连续 12 天</span>
                    </div>
                    <p class="text-xs text-white/70 leading-relaxed mb-3">距离本月目标 20 天还差 8 天，继续保持！</p>
                    <div class="flex gap-1">
                        <div class="flex-1 h-1.5 bg-white/20 rounded-full overflow-hidden">
                            <div class="h-full bg-white" style="width: 60%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 7 天柱状图 -->
            <div class="mb-5">
                <div class="flex items-center justify-between mb-3">
                    <div class="text-sm font-medium">本周专注</div>
                    <button class="text-xs text-primary font-medium">日 · 周 · 月</button>
                </div>
                <div class="bg-surface-container rounded-2xl p-4">
                    <div class="relative h-28">
                        <svg viewBox="0 0 360 100" class="w-full h-full" preserveAspectRatio="none">
                            <line x1="0" y1="20" x2="360" y2="20" stroke="#CAC4D0" stroke-width="0.5" stroke-dasharray="2 3" />
                            <line x1="0" y1="50" x2="360" y2="50" stroke="#CAC4D0" stroke-width="0.5" stroke-dasharray="2 3" />
                            <line x1="0" y1="80" x2="360" y2="80" stroke="#CAC4D0" stroke-width="0.5" stroke-dasharray="2 3" />
                            <rect x="10"  y="65" width="32" height="35" rx="3" fill="#EADDFF" />
                            <rect x="62"  y="50" width="32" height="50" rx="3" fill="#EADDFF" />
                            <rect x="114" y="40" width="32" height="60" rx="3" fill="#6750A4" />
                            <rect x="166" y="30" width="32" height="70" rx="3" fill="#6750A4" />
                            <rect x="218" y="15" width="32" height="85" rx="3" fill="#6750A4" />
                            <rect x="270" y="45" width="32" height="55" rx="3" fill="#6750A4" />
                            <rect x="322" y="60" width="32" height="40" rx="3" fill="#EADDFF" />
                        </svg>
                    </div>
                    <div class="flex justify-between text-[10px] text-on-surface-variant mt-2 px-1">
                        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                    </div>
                </div>
            </div>

            <!-- 任务分类统计 -->
            <div class="mb-5">
                <div class="flex items-center justify-between mb-3">
                    <div class="text-sm font-medium">任务分类（7 天）</div>
                    <div class="text-[10px] text-on-surface-variant">共 14 次</div>
                </div>
                <div class="bg-surface-container rounded-2xl p-4 space-y-3">

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="flex items-center gap-2 text-xs">
                                <i class="fa-solid fa-pen-fancy text-primary"></i>
                                <span>写作</span>
                            </div>
                            <div class="text-xs text-on-surface-variant">6 次 · 45%</div>
                        </div>
                        <div class="h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
                            <div class="h-full bg-primary rounded-full" style="width: 45%"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="flex items-center gap-2 text-xs">
                                <i class="fa-solid fa-code text-tertiary"></i>
                                <span>编程</span>
                            </div>
                            <div class="text-xs text-on-surface-variant">4 次 · 30%</div>
                        </div>
                        <div class="h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
                            <div class="h-full bg-tertiary rounded-full" style="width: 30%"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="flex items-center gap-2 text-xs">
                                <i class="fa-solid fa-book-open" style="color:#D4A574"></i>
                                <span>阅读</span>
                            </div>
                            <div class="text-xs text-on-surface-variant">2 次 · 15%</div>
                        </div>
                        <div class="h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
                            <div class="h-full rounded-full" style="width: 15%; background:#D4A574"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="flex items-center gap-2 text-xs">
                                <i class="fa-solid fa-graduation-cap" style="color:#2D6A4F"></i>
                                <span>学习</span>
                            </div>
                            <div class="text-xs text-on-surface-variant">1 次 · 7%</div>
                        </div>
                        <div class="h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
                            <div class="h-full rounded-full" style="width: 7%; background:#2D6A4F"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="flex items-center gap-2 text-xs">
                                <i class="fa-solid fa-palette" style="color:#D89BAE"></i>
                                <span>设计</span>
                            </div>
                            <div class="text-xs text-on-surface-variant">1 次 · 3%</div>
                        </div>
                        <div class="h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
                            <div class="h-full rounded-full" style="width: 3%; background:#D89BAE"></div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 每日目标 + 工作日 vs 周末 -->
            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-surface-container rounded-2xl p-4">
                    <div class="text-[10px] text-on-surface-variant tracking-wider mb-3">今日目标</div>
                    <div class="relative w-[90px] h-[90px] mx-auto mb-2">
                        <svg width="90" height="90" viewBox="0 0 90 90" class="-rotate-90">
                            <circle cx="45" cy="45" r="38" fill="none" stroke="#E7E0EC" stroke-width="6" />
                            <circle cx="45" cy="45" r="38" fill="none" stroke="#6750A4" stroke-width="6"
                                stroke-dasharray="238.76" stroke-dashoffset="95.5" stroke-linecap="round" />
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center mono text-lg font-light">3/5</div>
                    </div>
                    <div class="text-center text-xs text-on-surface-variant">再完成 2 次</div>
                </div>
                <div class="bg-surface-container rounded-2xl p-4">
                    <div class="text-[10px] text-on-surface-variant tracking-wider mb-3">工作日 vs 周末</div>
                    <div class="space-y-2.5">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span>工作日</span>
                                <span class="mono">4.2h</span>
                            </div>
                            <div class="h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
                                <div class="h-full bg-primary rounded-full" style="width: 60%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span>周末</span>
                                <span class="mono">2.8h</span>
                            </div>
                            <div class="h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
                                <div class="h-full bg-secondary rounded-full" style="width: 40%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 时段热力图入口 -->
            <button onclick="window.location.href='heatmap.html'" class="w-full bg-surface-container rounded-2xl p-4 flex items-center gap-3 state-layer">
                <div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-grip text-primary text-lg"></i>
                </div>
                <div class="flex-1 text-left">
                    <div class="text-sm font-medium">时段热力图</div>
                    <div class="text-xs text-on-surface-variant mt-0.5">7 × 24 = 168 格</div>
                </div>
                <i class="fa-solid fa-chevron-right text-on-surface-variant text-sm"></i>
            </button>

        </div>

        <!-- NavigationBar -->
        <div class="absolute bottom-0 left-0 right-0 bg-surface-container border-t border-outline-variant/30">
            <div class="flex items-stretch h-20 px-3">
                <button onclick="window.location.href='focus.html'" class="flex-1 flex flex-col items-center justify-center gap-1 state-layer">
                    <i class="fa-solid fa-droplet text-on-surface-variant text-lg"></i>
                    <span class="text-[11px] text-on-surface-variant">专注</span>
                </button>
                <button onclick="window.location.href='history.html'" class="flex-1 flex flex-col items-center justify-center gap-1 state-layer">
                    <div class="px-5 py-1 rounded-full bg-primary-container">
                        <i class="fa-solid fa-clock text-primary text-lg"></i>
                    </div>
                    <span class="text-[11px] font-medium text-on-surface">记录</span>
                </button>
                <button class="flex-1 flex flex-col items-center justify-center gap-1 state-layer">
                    <i class="fa-regular fa-user text-on-surface-variant text-lg"></i>
                    <span class="text-[11px] text-on-surface-variant">我的</span>
                </button>
            </div>
        </div>

    </div>

</body>
</html>
