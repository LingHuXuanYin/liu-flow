<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据迁移 · 流 Flow</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #7A4E7C;
  --primary-lifted: #8E5E91;
  --on-primary: #FFFFFF;
  --primary-container: #E8C5E5;
  --on-primary-container: #2A0E2C;
  --secondary-container: #F0EBF0;
  --tertiary: #D89BAE;
  --surface: #F0EBF0;
  --surface-variant: #E0D5E0;
  --surface-container: #F8F4F8;
  --on-surface: #2A1A2A;
  --on-surface-variant: #6B5B6B;
  --outline: #A89AA8;
  --outline-variant: #D5C8D5;
  --ring-glow: rgba(122, 78, 124, 0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Roboto', 'Noto Sans SC', system-ui, sans-serif;
  background: #0a0a0a;
  color: var(--on-surface);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.mono { font-family: 'Roboto Mono', 'SF Mono', monospace; }

/* Pixel 8/9 外框 */
.android-frame {
  width: 412px;
  height: 892px;
  background: #1a1a1a;
  border-radius: 48px;
  padding: 8px;
  box-shadow:
    0 0 0 2px rgba(255,255,255,0.05),
    0 0 0 6px #2a2a2a,
    0 30px 80px -20px rgba(0,0,0,0.6),
    0 50px 100px -20px var(--ring-glow);
  position: relative;
}
.android-screen {
  width: 100%; height: 100%;
  background: var(--surface);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
}
.punch-hole {
  position: absolute;
  top: 8px; left: 50%;
  transform: translateX(-50%);
  width: 14px; height: 14px;
  background: #000;
  border-radius: 50%;
  z-index: 50;
}

/* 状态栏 24dp */
.status-bar {
  height: 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  font-size: 14px;
  font-weight: 500;
  color: var(--on-surface);
}
.status-bar .icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }

/* 底部 3-button 导航条 */
.nav-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 56px;
  background: var(--surface);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid var(--outline-variant);
}
.nav-bar .nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  color: var(--on-surface-variant);
}
.nav-bar .nav-item .icon {
  font-size: 20px;
}

.migrate-screen {
  width: 100%; height: 100%;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  position: relative;
  padding-top: 56px;
}
.migrate-content {
  flex: 1;
  padding: 64px 32px 0;
  display: flex;
  flex-direction: column;
}
.migrate-icon {
  width: 96px;
  height: 96px;
  background: var(--primary-container);
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: var(--on-primary-container);
  margin-bottom: 32px;
  box-shadow: 0 4px 20px -8px var(--ring-glow);
}
.migrate-title {
  font-size: 26px;
  font-weight: 500;
  color: var(--on-surface);
  margin-bottom: 12px;
  line-height: 1.3;
}
.migrate-desc {
  font-size: 14px;
  color: var(--on-surface-variant);
  line-height: 1.7;
  margin-bottom: 32px;
}
.migrate-stats {
  background: var(--surface-container);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 32px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
}
.stat-row .label {
  color: var(--on-surface-variant);
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-row .value {
  color: var(--on-surface);
  font-family: 'Roboto Mono', monospace;
  font-weight: 500;
}
.stat-divider { height: 1px; background: var(--outline-variant); margin: 4px 0; }
.migrate-actions {
  margin-top: auto;
  padding: 24px 0 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.btn-secondary {
  width: 100%;
  height: 48px;
  border-radius: 24px;
  background: transparent;
  color: var(--primary);
  font-size: 14px;
  font-weight: 500;
  border: 1.5px solid var(--outline-variant);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-secondary:hover { border-color: var(--primary); }

</style>
</head>
<body>

<body>
  <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;padding:32px 0;">
    <div class="android-frame">
      <div class="android-screen">
        <div class="punch-hole"></div>

  <div class="status-bar">
    <div>2:48</div>
    <div class="icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-three-quarters"></i>
    </div>
  </div>

        <div class="migrate-screen">
          <div class="migrate-content">
            <div class="migrate-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <div class="migrate-title">检测到本地有<br/>V0.1.0 数据</div>
            <div class="migrate-desc">V0.2.0 起启用云端同步，登录后会自动把本地记录上传到云端。换手机、卸载重装都能找回。</div>
            <div class="migrate-stats">
              <div class="stat-row">
                <div class="label"><i class="fa-regular fa-circle-check" style="color: var(--primary);"></i> 专注记录</div>
                <div class="value">28 条</div>
              </div>
              <div class="stat-divider"></div>
              <div class="stat-row">
                <div class="label"><i class="fa-regular fa-calendar" style="color: var(--tertiary);"></i> 连续天数</div>
                <div class="value">12 天</div>
              </div>
              <div class="stat-divider"></div>
              <div class="stat-row">
                <div class="label"><i class="fa-regular fa-clock" style="color: var(--tertiary);"></i> 累计时长</div>
                <div class="value">14.2 h</div>
              </div>
              <div class="stat-divider"></div>
              <div class="stat-row">
                <div class="label"><i class="fa-solid fa-sliders" style="color: var(--on-surface-variant);"></i> 个人设置</div>
                <div class="value">6 项</div>
              </div>
            </div>
            <div class="migrate-actions">
              <button class="btn-primary">立即登录并迁移</button>
              <button class="btn-secondary">稍后再说</button>
            </div>
          </div>
        </div>

  <div class="nav-bar">
    <div class="nav-item">
      <div class="icon"><i class="fa-solid fa-droplet"></i></div>
      <div>专注</div>
    </div>
    <div class="nav-item">
      <div class="icon"><i class="fa-regular fa-clock"></i></div>
      <div>记录</div>
    </div>
    <div class="nav-item">
      <div class="icon"><i class="fa-regular fa-user"></i></div>
      <div>我的</div>
    </div>
  </div>

      </div>
    </div>
  </div>
</body>
</html>
