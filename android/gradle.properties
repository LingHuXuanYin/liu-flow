# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Disable BuildConfig generation by default (we only enable in :app where needed)
android.defaults.buildfeatures.buildconfig=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ====================================================================
# App version（集中管理）
#   - 主版本号在 APP_VERSION_NAME
#   - debug buildType 自动拼 "-debug"（在 app/build.gradle.kts:versionNameSuffix）
#   - 编译结果：
#       assembleDebug    → BuildConfig.VERSION_NAME = "0.6.0-debug"
#       assembleRelease  → BuildConfig.VERSION_NAME = "0.6.0"
# ====================================================================
APP_VERSION_NAME=0.6.1
APP_VERSION_CODE=7
